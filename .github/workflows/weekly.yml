name: threads-weekly-report

on:
  schedule:
    # 毎日 06:00 JST（= 21:00 UTC）に起動するが、main_weekly.py 内の曜日ゲートが
    # 生成は毎週 日曜・水曜、レポートは毎週 日曜だけ本処理を実行する（それ以外の日は即終了）。
    # ＝「次の生成日までの日数分の投稿生成→分析してレポート（日曜のみ）」を週2回のPDCAで回す。
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # 手動実行。FORCE_CYCLE=1 を Variable に入れるとサイクル日以外でも実行可。

concurrency:
  group: threads-weekly   # 投稿/収集とは別系統
  cancel-in-progress: false

# GITHUB_TOKEN は読み取りのみ（このrepoはワークフローから書き戻さない）
permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt anthropic

      - name: Run weekly (分析→レポート→任意で生成)
        env:
          BUSINESSES: ${{ secrets.BUSINESSES }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TZ_NAME: Asia/Tokyo
          # 生成は既定オフ。ANTHROPIC_API_KEY を Secret 登録し、Variable GENERATE_POSTS=1 で有効化。
          GENERATE_POSTS: ${{ vars.GENERATE_POSTS || '0' }}
          # GEN_STATUS=draft(人が確認) / queued(完全全自動で公開)。安全のため既定 draft。
          GEN_STATUS: ${{ vars.GEN_STATUS || 'draft' }}
          # ★事業別の上書き（2026-07-28追加）。従来は全事業共通の1つしか無く、
          # 「占いは自動公開・製造業は人の確認を挟む」ができなかった。
          # 製造業は過去2回BAN済みでガイドラインにも「3回目は永久BANリスク極大」と明記があるため、
          # 事業ごとに draft/queued を選べるようにする。空なら GEN_STATUS にフォールバック。
          GEN_STATUS_SEIZOGYO: ${{ vars.GEN_STATUS_SEIZOGYO || '' }}
          GEN_STATUS_URANAI: ${{ vars.GEN_STATUS_URANAI || '' }}
          GEN_STATUS_MEGURI: ${{ vars.GEN_STATUS_MEGURI || '' }}
          GEN_STATUS_SEIZOGYO2: ${{ vars.GEN_STATUS_SEIZOGYO2 || '' }}
          GEN_STATUS_SEIZOGYO3: ${{ vars.GEN_STATUS_SEIZOGYO3 || '' }}
          GEN_POSTS_PER_ACCOUNT: ${{ vars.GEN_POSTS_PER_ACCOUNT || '5' }}
          # 1日4本スケジュール対象（製造業/占い）は「次の生成サイクル日までの日数×4本」で
          # main_weekly.py の n_posts_for がコード側で自動計算する（日曜=12本／水曜=16本）。
          # ここでフォールバック値（|| '12' 等）を入れると Variable が常に非空になり、
          # 動的計算が一度も発動しなくなる（曜日に関わらず固定本数になり隙間/重複の原因）ので
          # 付けないこと。Variable は「0=その事業だけ生成オフ」の用途にだけ使う。
          GEN_POSTS_SEIZOGYO: ${{ vars.GEN_POSTS_SEIZOGYO }}
          GEN_POSTS_URANAI: ${{ vars.GEN_POSTS_URANAI }}
          GEN_POSTS_MEGURI: ${{ vars.GEN_POSTS_MEGURI }}
          # seizogyo2（住田）/seizogyo3（ぱし）も同様。0を設定すればその事業だけ生成オフにできる。
          GEN_POSTS_SEIZOGYO2: ${{ vars.GEN_POSTS_SEIZOGYO2 }}
          GEN_POSTS_SEIZOGYO3: ${{ vars.GEN_POSTS_SEIZOGYO3 }}
          GEN_MODEL: ${{ vars.GEN_MODEL || 'claude-opus-4-8' }}
          # キルスイッチ: Variable PAUSED=1 で生成・投稿を即停止。
          PAUSED: ${{ vars.PAUSED || '0' }}
          # 手動実行(workflow_dispatch)でサイクル日以外でも回したいとき Variable FORCE_CYCLE=1。
          FORCE_CYCLE: ${{ vars.FORCE_CYCLE || '0' }}
          REPORTS_DIR: reports
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # メール送信は main_weekly.py がアカウントごとに1通ずつ行う（ENABLE_EMAIL=1＋下記secret必須）。
          # EMAIL_BUSINESSES を空にすると運用中の全アカウントに個別送信（既定）。
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL || '0' }}
          EMAIL_BUSINESSES: ${{ vars.EMAIL_BUSINESSES || '' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          # MAIL_TO＝全事業共通の既定宛先。MAIL_TO_<NAME> を設定するとその事業だけ宛先を差し替える
          # （事業別レポート配布。例：seizogyo2 だけ担当者にも配る）。空なら既定にフォールバック。
          MAIL_TO: ${{ vars.MAIL_TO || secrets.MAIL_USERNAME }}
          MAIL_TO_SEIZOGYO: ${{ vars.MAIL_TO_SEIZOGYO || '' }}
          MAIL_TO_URANAI: ${{ vars.MAIL_TO_URANAI || '' }}
          MAIL_TO_MEGURI: ${{ vars.MAIL_TO_MEGURI || '' }}
          MAIL_TO_SEIZOGYO2: ${{ vars.MAIL_TO_SEIZOGYO2 || '' }}
          MAIL_TO_SEIZOGYO3: ${{ vars.MAIL_TO_SEIZOGYO3 || '' }}
        run: python main_weekly.py
